name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  # Sigstore keyless signing exchanges the workflow's OIDC token for a
  # short-lived signing certificate tied to this workflow's identity.
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v0.1.0, got '${tag}'"
            exit 1
          fi

          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "lianyaohu-app"))'
          )"
          if [[ "$manifest_version" != "${{ steps.release.outputs.version }}" ]]; then
            echo "::error::Tag ${{ steps.release.outputs.tag }} does not match Cargo version ${manifest_version}"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release binaries
        run: cargo build --release --locked -p lianyaohu-app

      - name: Package release
        id: package
        shell: bash
        run: |
          target="$(rustc -vV | awk '/host:/ {print $2}')"
          scripts/package-release.sh "${{ steps.release.outputs.version }}" "$target" target/release dist
          asset="dist/lianyaohu-${{ steps.release.outputs.version }}-${target}.tar.gz"
          checksum="${asset}.sha256"
          echo "asset=${asset}" >>"$GITHUB_OUTPUT"
          echo "checksum=${checksum}" >>"$GITHUB_OUTPUT"
          # `cosign sign-blob --bundle` emits cosign's legacy bundle format,
          # not the sigstore.json interchange format, so the asset name says
          # so. install.sh downloads and verifies this exact name.
          echo "bundle=${asset}.cosign.bundle" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign package (Sigstore keyless)
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle "${{ steps.package.outputs.bundle }}" \
            "${{ steps.package.outputs.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.os }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.bundle }}

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          BUNDLE: ${{ steps.package.outputs.bundle }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$ASSET" "$CHECKSUM" "$BUNDLE" --clobber
